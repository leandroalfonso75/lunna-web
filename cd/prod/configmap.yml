# Única env do front, lida em runtime (a mesma imagem serve qualquer ambiente).
# Produção: front em gestao.lunnashop.com.br, API em api.lunnashop.com.br.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunna-web-config
  namespace: lunna
  labels:
    app: lunna-web
data:
  NODE_ENV: production
  NUXT_PUBLIC_API_URL: https://api.lunnashop.com.br

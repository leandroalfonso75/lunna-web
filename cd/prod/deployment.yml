apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunna-web
  namespace: lunna
  labels: { app: lunna-web, role: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: lunna-web, role: web }
  template:
    metadata:
      labels: { app: lunna-web, role: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: lunna-web
          image: vinnialfonso/lunna-web:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: lunna-web-config }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/saude, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/saude, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
